@let _isLargeViewport = isLargeViewport();
@let _progressBarConfiguration = progressBarConfiguration();
@let _shouldAddSafeAreaPadding = shouldAddSafeAreaPadding();
@let _title = title();

<ng-container *transloco="let t; prefix: 'toolbar'">
  <mat-toolbar
    class="jet-sidenav-content-toolbar"
    [class.jet-add-safe-area-padding]="_shouldAddSafeAreaPadding"
  >
    <mat-progress-bar
      [aria-label]="t('loading')"
      [bufferValue]="_progressBarConfiguration.bufferValue"
      [class.opacity-0]="!_progressBarConfiguration.isVisible"
      [class.opacity-100]="_progressBarConfiguration.isVisible"
      [mode]="_progressBarConfiguration.mode"
      [value]="_progressBarConfiguration.value"
    />
    @if (_isLargeViewport) {
      <button
        matIconButton
        matTooltipPosition="after"
        type="button"
        [aria-label]="t('toggle-menu')"
        [jetAnalyticsEvent]="{ name: 'toggle_sidenav' }"
        [matTooltip]="t('toggle-menu')"
        (click)="toggleMatSidenav.emit()"
      >
        <mat-icon svgIcon="short-text-fill" />
      </button>
    } @else {
      <a
        matIconButton
        matTooltipPosition="after"
        [aria-label]="t('open-home')"
        [jetAnalyticsEvent]="{ name: 'open_home' }"
        [matTooltip]="t('home')"
        [routerLink]="['/']"
      >
        <mat-icon svgIcon="logo" />
      </a>
    }
    <h1>{{ _title }}</h1>
  </mat-toolbar>
</ng-container>
