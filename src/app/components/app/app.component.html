@let _directionality = directionality();
@let _isLargeViewport = isLargeViewport();
@let _matSidenavMode = matSidenavMode();
@let _shouldAddSafeArea = shouldAddSafeArea();

<ng-container *transloco="let t; prefix: 'app'">
  <mat-sidenav-container
    class="jet-sidenav-container"
    [dir]="_directionality"
  >
    <mat-sidenav
      #matSidenav
      class="jet-sidenav"
      fixedInViewport
      [mode]="_matSidenavMode"
      [(opened)]="isMatSidenavOpen"
    >
      <jet-sidenav
        [activeNavItemPath]="activeNavItemPath"
        (clickNavItem)="_matSidenavMode === 'over' && matSidenav.close()"
      />
    </mat-sidenav>
    <mat-sidenav-content class="jet-sidenav-content">
      <jet-toolbar
        [isLargeViewport]="_isLargeViewport"
        [shouldAddSafeArea]="_shouldAddSafeArea"
        (toggleMatSidenav)="matSidenav.toggle()"
      />
      <mat-tab-nav-panel #tabPanel>
        <main [class.jet-add-safe-area]="_shouldAddSafeArea">
          <router-outlet />
        </main>
      </mat-tab-nav-panel>
      <footer
        [class.jet-add-bottom-margin]="!_isLargeViewport"
        [class.jet-add-safe-area]="_shouldAddSafeArea"
      >
        <jet-footer />
      </footer>
      @if (!_isLargeViewport) {
        <nav
          backgroundColor="primary"
          class="jet-tab-nav-bar"
          disablePagination
          mat-tab-nav-bar
          [tabPanel]="tabPanel"
        >
          @for (navItem of navItems; track navItem.path) {
            <a
              mat-tab-link
              style="min-width: 0"
              [active]="activeNavItemPath === navItem.path"
              [aria-label]="navItem.nameKey | transloco"
              [routerLink]="[navItem.path]"
            >
              <mat-icon
                aria-hidden="false"
                [matBadge]="getBadgeContent(navItem.badge)"
                [matBadgeHidden]="!navItem.badge"
                [svgIcon]="navItem.iconName"
              />
            </a>
          }
        </nav>
      }
    </mat-sidenav-content>
  </mat-sidenav-container>
</ng-container>
