    <meta charset="utf-8" />
    <meta
      content="initial-scale=1, viewport-fit=cover, width=device-width"
      name="viewport"
    />

    <!-- Icons -->
    <link
      href="./apple-touch-icon.png"
      rel="apple-touch-icon"
    />
    <link
      href="./favicon.ico"
      rel="icon"
      type="image/x-icon"
    />

    <!-- Manifest -->
    <link
      href="./manifest.webmanifest"
      rel="manifest"
    />

    <link
      crossorigin="anonymous"

      href="./.well-known/ard.json"

    <meta
      content="noindex"
