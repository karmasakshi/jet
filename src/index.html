<!doctype html>
<html lang="en">
  <head>
    <base href="/" />
    <meta charset="utf-8" />
    <meta
      content="initial-scale=1, viewport-fit=cover, width=device-width"
      name="viewport"
    />

    <!-- Preconnects -->
    <link
      crossorigin="anonymous"
      href="https://www.googletagmanager.com"
      rel="preconnect"
    />

    <!-- Icons -->
    <link
      href="./apple-touch-icon.png"
      rel="apple-touch-icon"
    />
    <link
      href="./favicon.ico"
      rel="icon"
      type="image/x-icon"
    />

    <!-- LLMs -->
    <link
      href="./llms.txt"
      rel="describedby"
    />

    <!-- Manifest -->
    <link
      href="./manifest.webmanifest"
      rel="manifest"
    />

    <!-- SEO: General -->
    <link
      href="%NG_APP_APP_URL%"
      rel="canonical"
    />
    <meta
      content="Angular starter kit for building quality web apps fast."
      name="description"
    />
    <meta
      content="jet"
      name="keywords"
    />
    <title>Jet: Angular starter kit for building quality web apps fast</title>

    <!-- SEO: Open Graph -->
    <meta
      content="Angular starter kit for building quality web apps fast."
      property="og:description"
    />
    <meta
      content="%NG_APP_APP_URL%/og-image.jpg"
      property="og:image"
    />
    <meta
      content="Jet"
      property="og:site_name"
    />
    <meta
      content="Jet: Angular starter kit for building quality web apps fast"
      property="og:title"
    />
    <meta
      content="website"
      property="og:type"
    />
    <meta
      content="%NG_APP_APP_URL%"
      property="og:url"
    />

    <!-- SEO: X -->
    <meta
      content="summary_large_image"
      name="twitter:card"
    />

    <!-- Theme -->
    <meta
      content="#ffffff"
      name="theme-color"
    />
  </head>
  <body>
    <!-- iOS blur hack -->
    <div style="background-color: transparent; height: 6px; position: fixed; width: 100%"></div>
    <jet-app></jet-app>
    <noscript>Please enable JavaScript to continue using this application.</noscript>
  </body>
</html>
