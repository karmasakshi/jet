name: deploy-supabase-edge-functions

on:
  push:
    branches:
      - main
    paths:
      - './supabase/functions/**'
      - './supabase/config.toml'

permissions:
  contents: read

jobs:
  deploy-supabase-edge-functions:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v7 # https://github.com/marketplace/actions/checkout
        with:
          persist-credentials: false

      - uses: supabase/setup-cli@v3 # https://github.com/marketplace/actions/supabase-cli-action
        with:
          version: latest

      - name: create-env
        env:
          REMOVE_ME: ${{ vars.REMOVE_ME }}
        run: |
          printf "REMOVE_ME=%s\n" "$REMOVE_ME" > .env

      - name: set-env
        run: supabase secrets set --env-file .env --project-ref "$SUPABASE_PROJECT_ID"

      - name: deploy-supabase-edge-functions
        run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_ID"
